<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F2761C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#plate)"/>
  <rect width="100" height="100" rx="22.5" fill="url(#shine)"/>
  <!-- Pump body -->
  <rect x="25" y="20" width="36" height="58" rx="7" fill="#fff"/>
  <!-- Level window: empty above, fuel below -->
  <rect x="31" y="27" width="24" height="24" rx="4" fill="#F2761C" opacity=".22"/>
  <rect x="31" y="38" width="24" height="13" rx="3" fill="#E8670C"/>
  <!-- Base -->
  <rect x="19" y="75" width="48" height="8" rx="4" fill="#fff"/>
  <!-- Hose and nozzle -->
  <path d="M61 37 h5 a6 6 0 0 1 6 6 v20 a4.5 4.5 0 0 0 9 0 V39 l-7 -9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
