<!doctype html>
<!-- Source for images/og.png (1200×630). Regenerate:
     agent-browser set viewport 1200 630 && agent-browser open file://$PWD/site/_build/og.html && agent-browser screenshot site/images/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fuel Gauge social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f5f6f8; color: #1d1d1f; letter-spacing: -0.012em;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .sky i { position: absolute; border-radius: 50%; opacity: 0.85; }
  .sky i:nth-child(1) { width: 760px; height: 760px; left: -220px; top: -260px; background: radial-gradient(circle, #ffc98a, transparent 68%); }
  .sky i:nth-child(2) { width: 640px; height: 640px; right: -160px; top: -240px; background: radial-gradient(circle, #ffe3a3, transparent 68%); }
  .sky i:nth-child(3) { width: 600px; height: 600px; left: 380px; top: 250px; background: radial-gradient(circle, #c9e6ff, transparent 68%); }
  .sky i:nth-child(4) { width: 520px; height: 520px; right: -60px; top: 230px; background: radial-gradient(circle, #ffd3c4, transparent 68%); }
  .glass { position: relative; background: rgba(255,255,255,0.58); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(55,30,15,0.05), 0 14px 40px rgba(55,30,15,0.10); }
  .card { position: absolute; inset: 44px 52px; border-radius: 44px; padding: 0 64px; display: flex; flex-direction: column; justify-content: center; }
  .menubar { position: absolute; top: 22px; right: 28px; display: flex; align-items: center; gap: 18px; font-size: 21px; color: #1d1d1f; white-space: nowrap; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(55,30,15,0.08), 0 8px 22px rgba(55,30,15,0.12); color: #b84c06; }
  .pill svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pill .sep { color: #6e6e73; font-weight: 400; }
  .pill .ok { color: #15803d; }
  .clock { color: #3a3a3f; font-weight: 500; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 38px; font-weight: 600; letter-spacing: -0.025em; }
  .brand img { width: 92px; height: 92px; filter: drop-shadow(0 10px 20px rgba(120,50,10,0.25)); }
  h1 { margin: 34px 0 0; font-size: 92px; line-height: 1.0; font-weight: 700; letter-spacing: -0.045em; max-width: 960px; }
  h1 em { font-style: normal; color: #e8670c; white-space: nowrap; }
  .sub { margin-top: 26px; font-size: 26px; color: #55555b; letter-spacing: -0.015em; }
</style>
</head>
<body>
  <div class="sky"><i></i><i></i><i></i><i></i></div>
  <div class="card glass">
    <div class="menubar">
      <span class="pill"><svg viewBox="0 0 24 24"><rect x="3.7" y="3.7" width="11.2" height="16" rx="2.4" fill="none"/><rect x="5.7" y="12.3" width="7.2" height="5.4" rx=".8" fill="currentColor" stroke="none"/><rect x="1.9" y="20.4" width="14.9" height="2" rx="1" fill="currentColor" stroke="none"/><path d="M14.9 8H17.6Q19.5 8 19.5 9.9V16Q20.55 17.5 21.6 16V7.5L19.5 4.8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>5h 55% out ~11:50a <span class="sep">·</span> <span class="ok">wk 41% ok</span></span>
      <span class="clock">Mon 10:14 AM</span>
    </div>
    <div class="brand"><img src="../images/icon.svg" alt="">Fuel Gauge</div>
    <h1>Know if you'll make it <em>to reset.</em></h1>
    <div class="sub">Claude Code, Codex, and Grok Bot limits, forecast · Free for macOS · fuelgauge.app</div>
  </div>
</body>
</html>
