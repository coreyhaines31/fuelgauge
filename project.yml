name: FuelGauge
options:
  bundleIdPrefix: app.fuelgauge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  FuelGaugeCore:
    path: Packages/FuelGaugeCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  FuelGauge:
    type: application
    platform: macOS
    sources:
      - FuelGauge
    dependencies:
      - package: FuelGaugeCore
      - package: Sparkle
      # The `fuelgauge` command; the Homebrew cask links it onto the PATH.
      - target: FuelGaugeCLI
        copy:
          destination: executables
        codeSignOnCopy: true
    info:
      path: FuelGauge/Info.plist
      properties:
        CFBundleDisplayName: Fuel Gauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        SUFeedURL: https://github.com/coreyhaines31/fuelgauge/releases/latest/download/appcast.xml
        SUPublicEDKey: Q1CJyE3bOxRe6Th4ri58ULJ2Vk+kuyDpveBjDcywNXI=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Fuel Gauge
        PRODUCT_MODULE_NAME: FuelGauge
        PRODUCT_BUNDLE_IDENTIFIER: app.fuelgauge.FuelGauge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FuelGaugeCLI:
    type: tool
    platform: macOS
    sources: [FuelGaugeCLI]
    dependencies:
      - package: FuelGaugeCore
    settings:
      base:
        PRODUCT_NAME: fuelgauge
        PRODUCT_BUNDLE_IDENTIFIER: app.fuelgauge.FuelGauge.CLI
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
schemes:
  FuelGauge:
    build:
      targets:
        FuelGauge: all
    test:
      targets:
        - package: FuelGaugeCore/FuelGaugeCoreTests
